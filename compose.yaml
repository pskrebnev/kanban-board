# Repository-root Compose file.
#
# Start the full stack from a clean checkout with:
#   docker compose up --build
#
# Configuration is read from a local .env file (copy from .env.example).
# The backend container applies database migrations on startup before serving.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    environment:
      FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT}
      BACKEND_CONTAINER_PORT: ${BACKEND_CONTAINER_PORT}
    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_CONTAINER_PORT}"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_CONTAINER_PORT}
      DATABASE_URL: ${DATABASE_URL}
      APP_BASE_URL: ${APP_BASE_URL}
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_CONTAINER_PORT}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    profiles:
      - test
    ports:
      - "${MAILPIT_UI_PORT}:8025"
      - "${MAILPIT_SMTP_PORT}:1025"

  e2e:
    profiles:
      - test
    build:
      context: ./tests/e2e
      dockerfile: Containerfile
    environment:
      APP_URL: ${E2E_APP_URL}
    depends_on:
      - frontend
      - backend

volumes:
  postgres-data:
