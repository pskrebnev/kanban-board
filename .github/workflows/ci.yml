name: CI

# Quality gates: backend build + tests (against a real Postgres), frontend
# build, and a full-stack end-to-end run via Docker Compose. Runs on every push
# and pull request.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ticketing
          POSTGRES_USER: kanban_user
          POSTGRES_PASSWORD: change_this_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanban_user -d ticketing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kanban_user:change_this_local_password@localhost:5432/ticketing
      TEST_DATABASE_URL: postgresql://kanban_user:change_this_local_password@localhost:5432/ticketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit
      - name: Apply migrations
        working-directory: backend
        run: npm run migrate:up
      - name: Run tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  e2e:
    name: End-to-end (Docker Compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: cp .env.example .env
      - name: Build and run the e2e suite
        run: >-
          docker compose --profile test up --build
          --abort-on-container-exit --exit-code-from e2e e2e
      - name: Tear down
        if: always()
        run: docker compose --profile test down -v
