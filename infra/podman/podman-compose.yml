services:
  frontend:
    build:
      context: ../../frontend
      dockerfile: Containerfile
    environment:
      FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT}
      BACKEND_CONTAINER_PORT: ${BACKEND_CONTAINER_PORT}
    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_CONTAINER_PORT}"
    depends_on:
      - backend

  backend:
    build:
      context: ../../backend
      dockerfile: Containerfile
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_CONTAINER_PORT}
      DATABASE_URL: ${DATABASE_URL}
      APP_BASE_URL: ${APP_BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_CONTAINER_PORT}"
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT}:8025"
      - "${MAILPIT_SMTP_PORT}:1025"

  e2e:
    profiles:
      - test
    build:
      context: ../../tests/e2e
      dockerfile: Containerfile
    environment:
      APP_URL: ${E2E_APP_URL}
      E2E_MAILPIT_URL: ${E2E_MAILPIT_URL}
    depends_on:
      - frontend
      - backend
      - mailpit

volumes:
  postgres-data:
