version: "3.9"

services:
  frontend:
    build:
      context: ../../frontend
      dockerfile: Containerfile
    environment:
      FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT}
      BACKEND_CONTAINER_PORT: ${BACKEND_CONTAINER_PORT}
    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_CONTAINER_PORT}"
    depends_on:
      - backend

  backend:
    build:
      context: ../../backend
      dockerfile: Containerfile
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_CONTAINER_PORT}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_CONTAINER_PORT}"
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  e2e:
    profiles:
      - test
    build:
      context: ../../tests/e2e
      dockerfile: Containerfile
    environment:
      APP_URL: ${E2E_APP_URL}
    depends_on:
      - frontend
      - backend

volumes:
  postgres-data:
